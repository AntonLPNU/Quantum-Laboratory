[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-laboratory"
version = "0.5.0"
description = "Reproducible quantum-state and multispin dynamics laboratory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "streamlit>=1.49,<2",
  "plotly>=5.24,<7",
  "kaleido>=1.0,<2",
  "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
include = ["quantum_lab*"]

[tool.quantum-laboratory]
test-command = "python -m unittest discover -s tests -v"
